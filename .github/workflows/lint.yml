name: Lint

on: [push, pull_request]

jobs:

  lint:
    if:
      github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Lint
        run: |
          pip install ruff
          ruff check .
