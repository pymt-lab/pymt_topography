# An env for re/building a Python pymt-lab component with Meson.
name: pbld
channels:
  - conda-forge
dependencies:
  - python >=3.12
  - pip
  - make
  - bmipy
  - meson-python
  - numpy
  - bmi-tester >=0.5.5
  - pymt >=1.3
  - bmi-topography
  - importlib-resources
  - ruff
  - isort
  - black
  - python-build
  - twine
  - zest.releaser
